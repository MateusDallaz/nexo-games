<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <div id="main">
        <div id="sideimage">
            <div class="title">
                <img src="../IMG/gta6.webp" alt="GTA 6">
            </div>

            <div class="txt-image">
                <div class="logo"><span>N</span>Nexo Games</div>

                <div class="txt">
                    <h2>Sua próxima aventura começa aqui.</h2>
                    <p>Acesse sua biblioteca, acompanhe seus pedidos e aproveite as melhores ofertas da semana.</p>
                </div>
            </div>
        </div>
        <div id="Login">
            <h1>Entrar na sua conta</h1>
            <p class="subtitulo">Bem-vindo de volta! Digite seus dados para continuar.</p>

            <div class="camp">
                <label for="email">E-mail</label>
                <input type="text" id="email">

                <label for="password">Senha</label>
                <input type="password" id="password">
            </div>

            <button id="login">Entrar</button>
            <button id="link">Receber link de acesso por e-mail</button>
        </div>
    </div>
</body>
</html>
